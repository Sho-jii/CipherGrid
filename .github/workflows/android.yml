name: Verify and Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciphergrid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Verify and build Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Read application version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build web application
        run: npm run build

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Verify synchronized web assets
        shell: bash
        run: |
          test -f dist/index.html
          test -f android/app/src/main/assets/public/index.html
          echo "Web assets: $(find dist/assets -maxdepth 1 -type f | wc -l)"
          echo "Android assets: $(find android/app/src/main/assets/public/assets -maxdepth 1 -type f | wc -l)"

      - name: Test and build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --no-daemon

      - name: Prepare debug APK artifact
        shell: bash
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist-apk/CipherGrid-v${APP_VERSION}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: CipherGrid-Android-Debug
          path: dist-apk/CipherGrid-v${{ steps.app_version.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 14
